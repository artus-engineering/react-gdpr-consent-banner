packages:
    - .
    - example
allowBuilds:
    "@parcel/watcher": true
    esbuild: false
    lefthook: true
    sharp: false
    unrs-resolver: false
overrides:
    glob@>=9.0.0 <=14.0.1: ^14.0.2
    minimatch@>=7.0.0 <11.0.1: ^11.0.9
    # 1.2.0 peers only on emnapi 2.x-alpha; 1.2.3 accepts 1.x (oxc/unrs) and 2.x (rolldown).
    "@napi-rs/wasm-runtime": 1.2.3
minimumReleaseAgeExclude:
    - concurrently@10.0.1
    - postcss@8.5.10
