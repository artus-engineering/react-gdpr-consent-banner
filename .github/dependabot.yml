version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: main
    schedule:
      interval: "monthly"
    assignees:
      - "jonasscholl"
    # Babel 8.0.x does not strip TS call/new type args (useState<T>(), createContext<T>()),
    # which breaks babel-jest. Revisit when @babel/preset-typescript > 8.0.1 ships a fix.
    ignore:
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "JonasScholl"
    open-pull-requests-limit: 10
    groups:
      all:
        patterns:
          - "*"
