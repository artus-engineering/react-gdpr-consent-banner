name: Publish NPM Package

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
          registry-url: "https://npm.pkg.github.com"
          scope: "@artus-engineering"

      - name: Validate package version matches release tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Linting
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Import test (dist)
        run: pnpm run test:import

      - name: Unit Tests
        run: pnpm run test:unit

      # Baselines live under *-chromium-linux.png and must match the Playwright
      # Docker image (see AGENTS.md). The hosted runner’s bundled Chromium/fonts
      # differ from that image, so we run the suite inside the same container
      # used for `test:visual:update`.
      - name: Run visual regression tests (Playwright Docker)
        run: |
          docker run --rm --ipc=host -e CI=true -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.59.1-noble bash -lc \
            "npm i -g pnpm@10.33.0 >/dev/null && pnpm install --frozen-lockfile && \
             pnpm run build-storybook && pnpm run test:visual"

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
