name: "Branch"

# Runner: artus-arm64-runners (ARC) — see docs/ci.md.

on:
  push:
    branches:
      - main
  pull_request_target:

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: artus-arm64-runners
    permissions:
      contents: read
      actions: write # upload/download coverage artifact between jobs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node runtime deps (ARC)
        run: |
          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
          }
          if command -v apt-get >/dev/null 2>&1; then
            run_as_root apt-get update -qq
            run_as_root apt-get install -y -qq libatomic1
          elif command -v apk >/dev/null 2>&1; then
            run_as_root apk add --no-cache libatomic
          else
            echo "No apt-get/apk — ensure libatomic.so.1 is on the runner image" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Linting
        run: pnpm run lint

      - name: Build package
        run: pnpm run build

      - name: Build example for GitHub Pages
        run: pnpm --dir example run build:pages

      - name: Import test (dist)
        run: pnpm run test:import

      - name: Unit Tests
        run: pnpm run test:unit

      # Baselines live under *-chromium-linux.png and must match the Playwright
      # Docker image (see AGENTS.md). The hosted runner’s bundled Chromium/fonts
      # differ from that image, so we run the suite inside the same container
      # used for `test:visual:update`.
      - name: Run visual regression tests (Playwright Docker)
        run: |
          docker run --rm --ipc=host -e CI=true -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.62.0-noble bash -lc \
            "npm i -g pnpm@11.5.0 >/dev/null && pnpm install --frozen-lockfile && \
             pnpm run build-storybook && pnpm run test:visual"

      - name: Upload Unit Test Coverage (lcov) for SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diffs
          path: test-results
          retention-days: 7

  scan:
    name: SonarQube Scan
    runs-on: artus-arm64-runners
    needs: tests
    permissions:
      contents: read
      pull-requests: read # allows SonarQube to decorate PRs with analysis results
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage

      - name: Install Sonar Scanner deps (ARC)
        run: |
          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
          }
          if command -v apt-get >/dev/null 2>&1; then
            run_as_root apt-get update -qq
            run_as_root apt-get install -y -qq dirmngr gnupg locales libatomic1
            run_as_root sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen 2>/dev/null || true
            run_as_root locale-gen en_US.UTF-8 2>/dev/null || true
          elif command -v apk >/dev/null 2>&1; then
            run_as_root apk add --no-cache gnupg musl-locales libatomic
          else
            echo "No apt-get/apk — ensure dirmngr/gnupg, UTF-8 locale, libatomic on the runner image" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          SONAR_SCANNER_OPTS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
